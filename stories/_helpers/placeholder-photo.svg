<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <!--
  Padding comment: keep this file over 4 KiB. Vite inlines smaller assets as data: URIs,
  and the blocks' URL validation (lib/safe-link.ts) rejects data: for image fields, so a
  small file would never render in the Host / About photo. This is deliberately not
  minified. 
-->
