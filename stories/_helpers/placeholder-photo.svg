      <stop offset="0" stop-color="#3a3430"/>
      <stop offset="0.6" stop-color="#6b5446"/>
      <stop offset="1" stop-color="#b98558"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="860" cy="470" r="110" fill="#e6ae7a" opacity="0.85"/>
  <path d="M0 620 L180 500 L330 590 L520 430 L720 600 L900 520 L1200 650 L1200 800 L0 800Z" fill="#2f2b29"/>
